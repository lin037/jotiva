name: 报告问题 / Bug report
description: 帮助复现 Jotiva 的错误
body:
  - type: input
    id: version
    attributes:
      label: Jotiva 版本、系统与架构 / Versions
      placeholder: 0.1.1，Ubuntu 24.04，x64，Wayland
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 可以附一份可公开分享的最小 Markdown 示例。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期和实际结果 / Expected and actual behavior
      description: 涉及窗口关联时，补充宿主应用、有无外接显示器、全屏状态。Linux 请注明 X11 或 Wayland。
    validations:
      required: true
