name: 问题反馈 / Bug report
description: 帮助我们定位并复现 Jotiva 中的异常行为
body:
  - type: input
    id: version
    attributes:
      label: Jotiva 版本与系统环境 / Version & OS
      placeholder: 例如：macOS 15.2 (arm64) / Windows 11 24H2 (x64) / Ubuntu 24.04 (X11/Wayland)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 请尽量提供可公开分享的最小操作步骤或最小 Markdown 示例（注意脱敏）。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期与实际结果 / Expected & actual behavior
      description: 涉及窗口挂载时，请注明目标应用、显示器数量与全屏状态。
    validations:
      required: true
