name: Windows 使用反馈 / Windows feedback
description: 分享 Windows 上的使用场景或报告桌面集成问题
body:
  - type: input
    id: system
    attributes:
      label: Windows 版本和架构 / Windows version and architecture
      placeholder: Windows 11 24H2，x64
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Jotiva 版本与安装来源 / App version and installer source
  - type: textarea
    id: workflow
    attributes:
      label: 你想完成的操作或遇到的问题 / Workflow or problem
      description: 请附操作步骤和实际结果。涉及窗口挂载时，请写明宿主应用。
    validations:
      required: true
