name: Windows 桌面反馈 / Windows feedback
description: 报告 Windows 上的使用体验或窗口挂载兼容问题
body:
  - type: input
    id: system
    attributes:
      label: Windows 版本与架构 / Windows version & architecture
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Jotiva 版本与安装方式 / App version & installer
    validations:
      required: false
  - type: textarea
    id: workflow
    attributes:
      label: 问题描述或场景建议 / Problem or workflow
      description: 请附上操作步骤与实际表现；涉及窗口挂载时请写明目标应用名称。
    validations:
      required: true
