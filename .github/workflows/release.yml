name: Release packages

on:
  push:
    branches: ['build/v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages to GitHub Releases (version tags only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
      signed: ${{ steps.version.outputs.signed }}
      macos_signed: ${{ steps.version.outputs.macos_signed }}
      windows_signed: ${{ steps.version.outputs.windows_signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          SIGNED: ${{ inputs.publish || vars.JOTIVA_SIGNED_RELEASE == 'true' }}
          MACOS_SIGNED: ${{ vars.JOTIVA_MACOS_SIGNED_RELEASE == 'true' }}
          WINDOWS_SIGNED: ${{ vars.JOTIVA_WINDOWS_SIGNED_RELEASE == 'true' }}
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path

          version = json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"]
          frontend = json.loads(Path("package.json").read_text())["version"]
          rust = tomllib.loads(Path("src-tauri/Cargo.toml").read_text())["package"]["version"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), version
          assert version == frontend == rust, (version, frontend, rust)
          ref = os.environ["REF_NAME"]
          assert ref in (f"v{version}", f"build/v{version}"), (ref, version)
          signed = os.environ["SIGNED"].lower() == "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"number={version}", file=output)
              print(f"signed={str(signed).lower()}", file=output)
              for platform in ("macos", "windows"):
                  sign_installer = signed and os.environ[f"{platform.upper()}_SIGNED"].lower() == "true"
                  print(f"{platform}_signed={str(sign_installer).lower()}", file=output)
          PY

  ci:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS universal installers
    runs-on: macos-15
    needs: version
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Import Developer ID application and installer identities
        if: needs.version.outputs.macos_signed == 'true'
        env:
          CERTIFICATES: ${{ secrets.JOTIVA_MAC_CERTIFICATES }}
          CERT_PASSWORD: ${{ secrets.JOTIVA_MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/jotiva.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          cert="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$CERTIFICATES" | base64 -D > "$cert"
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
      - name: Build the universal application
        env:
          SIGNED: ${{ needs.version.outputs.signed }}
          MACOS_SIGNED: ${{ needs.version.outputs.macos_signed }}
          JOTIVA_UPDATER_PUBLIC_KEY: ${{ vars.JOTIVA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          JOT_INSTALLER_IDENTITY: ${{ vars.JOT_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          args=()
          if [[ "$MACOS_SIGNED" == true ]]; then
            : "${APPLE_SIGNING_IDENTITY:?}" "${JOT_INSTALLER_IDENTITY:?}"
            : "${APPLE_ID:?}" "${APPLE_PASSWORD:?}" "${APPLE_TEAM_ID:?}"
          else
            unset APPLE_SIGNING_IDENTITY JOT_INSTALLER_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [[ "$SIGNED" == true ]]; then
            python3 scripts/update-release.py config "$RUNNER_TEMP/update.json"
            args+=(--config "$RUNNER_TEMP/update.json")
          fi
          python3 scripts/build-macos.py "${args[@]}" --bundles app --target universal-apple-darwin -- --locked
      - name: Build and verify installers
        env:
          JOT_INSTALLER_IDENTITY: ${{ needs.version.outputs.macos_signed == 'true' && vars.JOT_INSTALLER_IDENTITY || '' }}
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          python3 -m pip install -r scripts/requirements-macos.txt
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Jotiva.app
          lipo "$app/Contents/MacOS/Jotiva" -verify_arch arm64 x86_64
          python3 scripts/package-macos.py "$app" --output-dir artifacts
          file="artifacts/Jotiva_${VERSION}_universal"
          python3 qa/macos/installers.py "$app" "$file.dmg" "$file.pkg" --zip "$file.zip"
      - name: Verify publisher and notarize installers
        if: needs.version.outputs.macos_signed == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          target=src-tauri/target/universal-apple-darwin/release/bundle/macos
          xcrun stapler validate "$target/Jotiva.app"
          dmg=(artifacts/*.dmg)
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "${dmg[0]}"
          for file in artifacts/*.pkg artifacts/*.dmg; do
            xcrun notarytool submit "$file" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$file"
            xcrun stapler validate "$file"
          done
      - name: Collect the signed updater archive
        if: needs.version.outputs.signed == 'true'
        run: |
          target=src-tauri/target/universal-apple-darwin/release/bundle/macos
          cp "$target/Jotiva.app.tar.gz" "$target/Jotiva.app.tar.gz.sig" artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-macos-universal
          path: artifacts/
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    runs-on: windows-2022
    needs: version
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build NSIS installer
        shell: pwsh
        env:
          SIGNED: ${{ needs.version.outputs.signed }}
          WINDOWS_SIGNED: ${{ needs.version.outputs.windows_signed }}
          CERTIFICATE: ${{ secrets.JOTIVA_WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.JOTIVA_WINDOWS_CERTIFICATE_PASSWORD }}
          JOTIVA_UPDATER_PUBLIC_KEY: ${{ vars.JOTIVA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $configArgs = @()
          if ($env:WINDOWS_SIGNED -eq 'true') {
            $file = Join-Path $env:RUNNER_TEMP 'publisher.pfx'
            try {
              [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:CERTIFICATE))
              $password = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $file -CertStoreLocation Cert:\CurrentUser\My -Password $password
              $env:JOTIVA_CERT_THUMBPRINT = ($cert | Where-Object HasPrivateKey | Select-Object -First 1).Thumbprint
              if (!$env:JOTIVA_CERT_THUMBPRINT) { throw 'Missing Windows code signing identity' }
            } finally { Remove-Item -Force -ErrorAction SilentlyContinue $file }
          }
          if ($env:SIGNED -eq 'true') {
            $config = Join-Path $env:RUNNER_TEMP 'update.json'
            python scripts/update-release.py config $config
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $configArgs = @('--config', $config)
          }
          pnpm tauri build @configArgs --bundles nsis -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:WINDOWS_SIGNED -eq 'true') {
            $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe') + @(Get-Item 'src-tauri/target/release/Jotiva.exe')
            foreach ($file in $files) {
              $result = Get-AuthenticodeSignature $file.FullName
              if ($result.Status -ne 'Valid' -or $result.SignerCertificate.Thumbprint -ne $env:JOTIVA_CERT_THUMBPRINT) { throw "Publisher verification failed for $file" }
            }
          }
      - name: Check installer and executable metadata
        shell: pwsh
        env:
          JOTIVA_VERSION: ${{ needs.version.outputs.number }}
        run: |
          $ErrorActionPreference = "Stop"
          $target = "src-tauri/target/release"
          $installer = @(Get-ChildItem "$target/bundle/nsis/*-setup.exe")
          if ($installer.Count -ne 1 -or $installer[0].Name -notlike "*_${env:JOTIVA_VERSION}_x64-setup.exe") {
            throw "Wrong installer version or architecture"
          }
          & 7z t $installer[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Invalid NSIS archive" }
          $version = (Get-Item "$target/Jotiva.exe").VersionInfo
          if ("$($version.ProductMajorPart).$($version.ProductMinorPart).$($version.ProductBuildPart)" -ne $env:JOTIVA_VERSION) {
            throw "Wrong application version"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe*
          if-no-files-found: error

  linux:
    name: Linux x86_64 packages
    runs-on: ubuntu-24.04
    needs: version
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - name: Install build and smoke-test dependencies
        timeout-minutes: 6
        run: |
          # The runner's Azure mirror can stall. Use the official Ubuntu archive for these libraries.
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" update -o APT::Update::Error-Mode=any
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2t64 patchelf xvfb xauth dbus-x11
      - name: Build Linux packages
        env:
          SIGNED: ${{ needs.version.outputs.signed }}
          JOTIVA_UPDATER_PUBLIC_KEY: ${{ vars.JOTIVA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=()
          if [[ "$SIGNED" == true ]]; then
            python3 scripts/update-release.py config "$RUNNER_TEMP/update.json"
            args+=(--config "$RUNNER_TEMP/update.json")
          fi
          pnpm tauri build "${args[@]}" --bundles deb,appimage -- --locked
      - name: Check Debian launcher and AppImage
        env:
          VERSION: ${{ needs.version.outputs.number }}
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          packages=src-tauri/target/release/bundle
          deb=("$packages"/deb/*.deb)
          appimage=("$packages"/appimage/*.AppImage)
          test "$(dpkg-deb --field "${deb[0]}" Version)" = "$VERSION"
          test "$(dpkg-deb --field "${deb[0]}" Architecture)" = amd64
          xvfb-run -a dbus-run-session -- python3 qa/linux-package.py "${deb[0]}"
          "${appimage[0]}" --appimage-extract > /tmp/jotiva-appimage-files
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/Jotiva
          mkdir -p artifacts
          cp "${deb[0]}" "${appimage[0]}" artifacts/
          if [[ "${{ needs.version.outputs.signed }}" == true ]]; then cp "${appimage[0]}.sig" artifacts/; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-linux-x86_64
          path: artifacts/
          if-no-files-found: error

  collect:
    name: Assemble packages and checksums
    runs-on: ubuntu-24.04
    needs: [version, macos, windows, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true
      - name: Export source and hash package files
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          git archive --format=tar.gz --prefix="Jotiva-${VERSION}/" --output="artifacts/Jotiva-${VERSION}-source.tar.gz" HEAD
          git archive --format=zip --output=artifacts/HelloJotiva.zip HEAD \
            docs/HelloJotiva.md docs/en/HelloJotiva.md \
            docs/assets/hello-jotiva docs/en/assets/hello-jotiva
          if [[ "${{ needs.version.outputs.signed }}" == true ]]; then
            python3 scripts/update-release.py manifest artifacts "$VERSION"
          fi
          cd artifacts
          files=(./*.dmg ./*.pkg ./*.zip ./*-setup.exe ./*.deb ./*.AppImage ./*.tar.gz)
          if [[ -f latest.json ]]; then files+=(./*.sig ./latest.json); fi
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ needs.version.outputs.number }}
          path: artifacts/
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: github.ref_type == 'tag' && inputs.publish
    runs-on: ubuntu-24.04
    needs: [version, ci, collect]
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ needs.version.outputs.number }}
          path: artifacts
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum -c SHA256SUMS)
          notes=".github/release-notes/$TAG.md"
          args=(--generate-notes)
          if [[ -f "$notes" ]]; then
            args=(--notes-file "$notes")
          fi
          gh release create "$TAG" --verify-tag --title "Jotiva ${TAG#v}" "${args[@]}" artifacts/*
