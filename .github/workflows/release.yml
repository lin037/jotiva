name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  packages:
    name: macOS universal installers
    runs-on: macos-15
    needs: ci
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path

          tag = os.environ["TAG"]
          config = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          frontend = json.loads(Path("package.json").read_text())
          rust = tomllib.loads(Path("src-tauri/Cargo.toml").read_text())
          assert tag == f'v{config["version"]}' == f'v{frontend["version"]}' == f'v{rust["package"]["version"]}'
          PY
      - name: Build application
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          python3 scripts/build-macos.py --bundles app --target universal-apple-darwin -- --locked
      - name: Build and verify installers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -m pip install -r scripts/requirements-macos.txt
          version="${TAG#v}"
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Jotiva.app
          lipo "$app/Contents/MacOS/Jotiva" -verify_arch arm64 x86_64
          python3 scripts/package-macos.py "$app" --output-dir artifacts
          file="artifacts/Jotiva_${version}_universal"
          python3 qa/macos/installers.py "$app" "$file.dmg" "$file.pkg" --zip "$file.zip"
          git archive --format=tar.gz --prefix="Jotiva-${version}/" --output="artifacts/Jotiva-${version}-source.tar.gz" HEAD
          cd artifacts
          shasum -a 256 ./*.dmg ./*.pkg ./*.zip ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos
          path: artifacts/
          if-no-files-found: error

  publish:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: packages
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-macos
          path: artifacts
      - name: Check files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum -c SHA256SUMS)
          notes=".github/release-notes/$TAG.md"
          args=(--generate-notes)
          if [[ -f "$notes" ]]; then
            args=(--notes-file "$notes")
          fi
          gh release create "$TAG" --verify-tag --title "Jotiva ${TAG#v}" "${args[@]}" artifacts/*
