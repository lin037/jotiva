[package]
name = "jot"
version = "0.2.0"
description = "Window-aware Markdown notes"
license = "MIT"
edition = "2024"

[[bin]]
name = "Jotiva"
path = "src/main.rs"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
global-hotkey = "0.8"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
same-file = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "multipart"] }
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
trash = "5"
dunce = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-opener = "2"
x11rb = "0.13"
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security_Credentials"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
