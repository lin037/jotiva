[package]
name = "jot"
version = "0.1.0"
description = "Window-aware Markdown notes"
license = "MIT"
edition = "2024"

[[bin]]
name = "Jotiva"
path = "src/main.rs"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
global-hotkey = "0.8"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
tauri-nspanel = "2.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
